<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identity Card - Hanan Ahmed Ali</title>
  
  <style>
    /* 
      ==========================================================================
      CSS DESIGN TOKENS & VARIABLES
      Change any value here to customize colors, dimensions, typography, and spacing.
      ==========================================================================
    */
    :root {
      /* Palette Colors */
      --color-bg-page: #0b1320;
      --color-metallic-blue-dark: #122238;
      --color-metallic-blue-mid: #1e385c;
      --color-metallic-blue-light: #2c4d7d;
      --color-accent-dark-blue: #08101d;
      --color-accent-beige: #ebdcc3;
      --color-accent-beige-light: #f9f4eb;
      --color-text-primary: #ffffff;
      --color-text-secondary: #ebdcc3;
      --color-text-muted: #8fa5c2;
      --color-border-light: rgba(235, 220, 195, 0.35);
      --color-border-highlight: rgba(255, 255, 255, 0.45);
      --color-disabled-icon: rgba(255, 255, 255, 0.3);
      --color-shadow-outer: rgba(0, 0, 0, 0.6);
      --color-shadow-inner: rgba(0, 0, 0, 0.4);

      /* Print & Display Dimensions (Standard ID-1 / Bank Card: 85.6mm x 54mm) */
      --card-width-mm: 85.6mm;
      --card-height-mm: 54mm;
      --card-corner-radius: 3.8mm;

      /* Typography */
      --font-family-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-size-name: 11pt;
      --font-size-title: 7.2pt;
      --font-size-org: 6.2pt;
      --font-size-label: 4.8pt;
      --font-size-value: 6.8pt;

      /* Spacing & Layout */
      --card-padding: 3.8mm;
      --gap-tight: 1mm;
      --gap-normal: 2.2mm;

      /* Dynamic Display Scaling for Screen */
      --screen-card-scale: 1.25;
      
      /* Accessibility Touch Target Minimum */
      --min-touch-target: 44px;
    }

    /* Reset & Base Setup */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family-sans);
      background-color: var(--color-bg-page);
      background-image: 
        radial-gradient(circle at 50% 30%, #1a304e 0%, var(--color-bg-page) 70%),
        repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.015) 0px, rgba(255, 255, 255, 0.015) 2px, transparent 2px, transparent 10px);
      color: var(--color-text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* Screen Wrapper for Perspective */
    .card-scene {
      perspective: 1200px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 28px;
    }

    /* Physical Identity Card Realism */
    .id-card {
      width: var(--card-width-mm);
      height: var(--card-height-mm);
      position: relative;
      border-radius: var(--card-corner-radius);
      
      /* Metallic Blue Brushed Texture & Micro Gradients */
      background: 
        linear-gradient(135deg, 
          var(--color-metallic-blue-dark) 0%, 
          var(--color-metallic-blue-mid) 35%, 
          var(--color-accent-dark-blue) 70%, 
          var(--color-metallic-blue-light) 100%);
      
      /* Physical Shadow & Sharp Lighter Edge */
      box-shadow: 
        0 18px 40px -10px var(--color-shadow-outer),
        0 8px 16px -6px var(--color-shadow-inner),
        inset 0 1px 1px var(--color-border-highlight),
        inset 0 -1px 1px var(--color-shadow-inner);
      
      border: 1px solid var(--color-border-light);
      padding: var(--card-padding);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      user-select: none;
      transform-style: preserve-3d;
      transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.2s cubic-bezier(0.25, 1, 0.5, 1);
      transform: scale(var(--screen-card-scale));
    }

    /* Light Sheen Overlay Effect */
    .card-sheen {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      border-radius: var(--card-corner-radius);
      background: linear-gradient(120deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.04) 40%, transparent 65%);
      mix-blend-mode: overlay;
      z-index: 5;
      transition: background 0.15s ease-out;
    }

    /* Subtle Metallic Geometric Watermark Accent */
    .card-watermark {
      position: absolute;
      right: -10mm;
      bottom: -10mm;
      width: 42mm;
      height: 42mm;
      border-radius: 50%;
      border: 1.5mm solid rgba(235, 220, 195, 0.05);
      pointer-events: none;
      z-index: 1;
    }

    .card-watermark::after {
      content: "";
      position: absolute;
      top: 4mm;
      left: 4mm;
      right: 4mm;
      bottom: 4mm;
      border-radius: 50%;
      border: 0.8mm dashed rgba(235, 220, 195, 0.08);
    }

    /* Card Content Structure */
    .card-content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Main Section: 2 Columns (Left Avatar & Bio, Right Contact Info) */
    .card-main {
      display: grid;
      grid-template-columns: 24mm 1fr;
      gap: var(--gap-normal);
      height: calc(100% - 7mm);
    }

    /* Left Column: Avatar & Person Profile */
    .col-left {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .avatar-wrapper {
      width: 20mm;
      height: 20mm;
      position: relative;
      border-radius: 2.5mm;
      overflow: hidden;
      border: 1px solid var(--color-border-light);
      background-color: var(--color-accent-dark-blue);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      flex-shrink: 0;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Fallback Initials Box if Picture Fails to Load */
    .avatar-fallback {
      display: none;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--color-accent-dark-blue) 0%, var(--color-metallic-blue-dark) 100%);
      color: var(--color-accent-beige);
      font-weight: 700;
      font-size: 9pt;
      letter-spacing: 1px;
      align-items: center;
      justify-content: center;
      border-radius: 2.5mm;
      text-transform: uppercase;
    }

    .profile-info {
      margin-top: 1.2mm;
      width: 100%;
    }

    .full-name {
      font-size: var(--font-size-name);
      font-weight: 700;
      color: var(--color-accent-beige);
      line-height: 1.1;
      letter-spacing: -0.1px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    .job-title {
      font-size: var(--font-size-title);
      font-weight: 500;
      color: var(--color-text-primary);
      margin-top: 0.8mm;
      line-height: 1.15;
    }

    .organization {
      font-size: var(--font-size-org);
      font-weight: 400;
      color: var(--color-text-muted);
      margin-top: 0.4mm;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    /* Right Column: Contact Details */
    .col-right {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding-left: 1mm;
      border-left: 1px solid rgba(235, 220, 195, 0.12);
    }

    .contact-item {
      margin-bottom: 2mm;
      display: flex;
      flex-direction: column;
    }

    .contact-item:last-child {
      margin-bottom: 0;
    }

    .contact-label {
      font-size: var(--font-size-label);
      font-weight: 600;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1;
      margin-bottom: 0.5mm;
    }

    .contact-value {
      font-size: var(--font-size-value);
      font-weight: 500;
      color: var(--color-accent-beige-light);
      text-decoration: none;
      word-break: break-word;
      line-height: 1.2;
      position: relative;
      display: inline-block;
      transition: color 0.15s ease;
    }

    /* Standardized accessible tap target for links without changing small card layout */
    .card-link::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      min-width: var(--min-touch-target);
      min-height: var(--min-touch-target);
    }

    .contact-value.card-link:hover,
    .contact-value.card-link:focus {
      color: var(--color-accent-beige);
      text-decoration: underline;
    }

    /* Footer: Social Icons Row */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-top: 1mm;
      border-top: 1px solid rgba(235, 220, 195, 0.15);
    }

    .social-row {
      display: flex;
      align-items: center;
      gap: 3mm;
    }

    .social-icon-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--color-accent-beige);
      text-decoration: none;
      transition: color 0.15s ease, transform 0.15s ease;
      background: transparent;
      border: none;
      padding: 0;
    }

    .social-icon-btn::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      min-width: var(--min-touch-target);
      min-height: var(--min-touch-target);
    }

    .social-icon-btn:not(.disabled):hover,
    .social-icon-btn:not(.disabled):focus {
      color: #ffffff;
      transform: translateY(-1px);
    }

    .social-icon-btn.disabled {
      color: var(--color-disabled-icon);
      cursor: not-allowed;
      opacity: 0.45;
    }

    .social-svg {
      width: 3.8mm;
      height: 3.8mm;
      fill: currentColor;
    }

    /* Outer Page Control Button */
    .actions-bar {
      display: flex;
      justify-content: center;
    }

    .print-btn {
      background: linear-gradient(135deg, var(--color-metallic-blue-mid) 0%, var(--color-accent-dark-blue) 100%);
      color: var(--color-accent-beige);
      border: 1px solid var(--color-border-light);
      padding: 12px 28px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: var(--min-touch-target);
      min-width: 140px;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .print-btn:hover {
      background: linear-gradient(135deg, var(--color-metallic-blue-light) 0%, var(--color-metallic-blue-dark) 100%);
      color: #ffffff;
      border-color: var(--color-border-highlight);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
      transform: translateY(-2px);
    }

    .print-btn:active {
      transform: translateY(0);
    }

    /* Accessibility Focus Outlines */
    :focus-visible {
      outline: 2px solid var(--color-accent-beige);
      outline-offset: 3px;
      border-radius: 3px;
    }

    /* Screen Responsive Adjustments for Mobile Viewports */
    @media screen and (max-width: 480px) {
      :root {
        --screen-card-scale: 1.02;
      }
      body {
        padding: 16px 8px;
      }
    }

    /* 
      ==========================================================================
      PRINT STYLESHEET
      Ensures ONLY the 85.6mm x 54mm card prints at exact physical dimensions.
      ==========================================================================
    */
    @media print {
      @page {
        size: auto;
        margin: 0;
      }

      html, body {
        background: none !important;
        background-color: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
        min-height: 100vh !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .no-print,
      .actions-bar {
        display: none !important;
      }

      .card-scene {
        margin: 0 !important;
        padding: 0 !important;
        perspective: none !important;
      }

      .id-card {
        width: 85.6mm !important;
        height: 54mm !important;
        transform: none !important;
        box-shadow: none !important;
        border: 0.5pt solid rgba(0, 0, 0, 0.2) !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .card-sheen {
        display: none !important;
      }
    }
  </style>
</head>

  <script>
    /**
     * Handles picture loading failure by displaying initials badge
     */
    function handleAvatarError() {
      const img = document.getElementById('avatar-img');
      const fallback = document.getElementById('avatar-fallback');
      if (img) img.style.display = 'none';
      if (fallback) fallback.style.display = 'flex';
    }

    /**
     * Physical 3D tilt effect on mouse movement
     */
    (function initCardTilt() {
      const card = document.getElementById('id-card');
      const scene = document.getElementById('card-scene');
      const sheen = document.getElementById('card-sheen');

      if (!card || !scene) return;

      // Respect user motion preference settings
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (prefersReducedMotion) return;

      const screenScale = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--screen-card-scale')) || 1.25;

      scene.addEventListener('mousemove', function(e) {
        const rect = scene.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        // Subtle realistic tilt angles (max ~8 deg)
        const rotateX = ((y - centerY) / centerY) * -8;
        const rotateY = ((x - centerX) / centerX) * 8;

        card.style.transform = `scale(${screenScale}) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg)`;

        if (sheen) {
          const sheenX = (x / rect.width) * 100;
          const sheenY = (y / rect.height) * 100;
          sheen.style.background = `radial-gradient(circle at ${sheenX.toFixed(1)}% ${sheenY.toFixed(1)}%, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.06) 45%, transparent 75%)`;
        }
      });

      scene.addEventListener('mouseleave', function() {
        card.style.transform = `scale(${screenScale}) rotateX(0deg) rotateY(0deg)`;
        if (sheen) {
          sheen.style.background = 'linear-gradient(120deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.04) 40%, transparent 65%)';
        }
      });
    })();
  </script>
</body>
</html>
